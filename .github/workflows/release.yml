name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    # 环境值按分发名（wop-mcp）：PYPI_TOKEN 配置于该 GitHub Environment
    # （或仓库级 Secrets，环境引用不影响仓库级回退）
    environment: wop-mcp
    permissions:
      # write 仅用于创建 GitHub Release 条目；PyPI 发布走 PYPI_TOKEN，不占 token 权限
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag matches pyproject version
        # 版本单一源纪律：tag vX.Y.Z 必须与 pyproject [project].version 严格一致，
        # 不一致即刻 fail（防止 tag 与发布产物版本漂移）
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJ_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PROJ_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME}（${TAG_VERSION}）与 pyproject.toml version（${PROJ_VERSION}）不一致"
            exit 1
          fi
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pytest/pytest-cov 属测试工具链而非运行时依赖，CI 显式安装
          pip install -e . pytest pytest-cov
      - name: Test with coverage gate (>= 95%, must pass before publish)
        run: python -m pytest --cov=wop_mcp --cov-fail-under=95
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        # 发布步骤位于测试全绿之后，失败不留半发布状态
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
      - name: Create GitHub Release
        # 仅在 PyPI 发布成功后执行（前置步骤失败即跳过）——Release 条目 = 已发布信号；
        # 资产：创建即挂 dist/*（sdist+wheel，二进制归档语义）；已存在（workflow 重跑）时
        # 补传 --clobber 幂等，不重复建条目；说明用 --generate-notes 基线，发布后可随时人工编辑
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "wop-mcp ${VERSION}" --generate-notes dist/*
          fi
