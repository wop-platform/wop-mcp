[project]
name = "wop-mcp"
version = "0.1.0"
description = "万联易达开放平台（WOP）MCP Server —— 文档获取与密钥对生成"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wop-platform" }]
keywords = ["wop", "mcp", "wanlianyida", "open-platform", "sm2", "rsa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "mcp>=2.0",
    "cryptography>=41",
    "gmssl>=3.2.2",
    "wop-python-sdk>=0.1.7",
]

[project.urls]
Homepage = "https://github.com/wop-platform/wop-mcp"
Repository = "https://github.com/wop-platform/wop-mcp"
Changelog = "https://github.com/wop-platform/wop-mcp/releases"
Issues = "https://github.com/wop-platform/wop-mcp/issues"

[project.scripts]
wop-mcp = "wop_mcp.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wop_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["wop_mcp"]

[tool.coverage.report]
fail_under = 95
show_missing = true
